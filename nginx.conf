server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 2M;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Headers de seguridad (repetidos en cada location porque add_header no se hereda
  # cuando el location define los suyos; por eso se usa un include).
  include /etc/nginx/snippets/security-headers.conf;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # El service worker nunca debe cachearse
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    default_type application/javascript;
  }

  location = /manifest.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;   # un asset inexistente devuelve 404, no index.html
  }

  # Fallback SPA solo para navegaciones
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
